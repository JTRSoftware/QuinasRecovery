<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Recuperação de palavra-passe | Quinas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #17352c;
      background: #edf3ef;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: repeating-linear-gradient(135deg, #edf3ef 0 18px, #e7efea 18px 19px);
    }

    main {
      width: min(100%, 460px);
      padding: 34px;
      border: 1px solid #c7d8ce;
      border-top: 5px solid #c98135;
      background: #fff;
      box-shadow: 0 18px 50px #17352c1c;
    }

    .brand {
      margin: 0 0 28px;
      color: #39705a;
      font: 700 13px/1.2 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(27px, 7vw, 36px);
      font-weight: 500;
      line-height: 1.12;
    }

    p {
      margin: 0;
      color: #52675e;
      font: 16px/1.55 Arial, sans-serif;
    }

    .action {
      display: block;
      margin-top: 26px;
      padding: 15px 18px;
      background: #245a45;
      color: #fff;
      font: 700 15px/1.2 Arial, sans-serif;
      text-align: center;
      text-decoration: none;
    }

    .action:focus-visible {
      outline: 3px solid #c98135;
      outline-offset: 3px;
    }

    .status {
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 420px) {
      main { padding: 27px 23px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Quinas · JTR Software</p>
    <h1>Recuperação de palavra-passe</h1>
    <p id="description">A preparar o link de recuperação.</p>
    <a class="action" id="open-app" href="#" hidden>Abrir aplicação Quinas</a>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const description = document.getElementById('description');
      const status = document.getElementById('status');
      const openApp = document.getElementById('open-app');
      const fragment = window.location.hash.slice(1);
      const token = /^[a-f0-9]{64}$/i.test(fragment)
        ? fragment
        : new URLSearchParams(fragment).get('token');

      window.history.replaceState(null, '', window.location.pathname + window.location.search);

      if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
        description.textContent = 'Este link está incompleto ou inválido. Pede um novo e-mail de recuperação na aplicação.';
        status.textContent = '';
        return;
      }

      const appUrl = new URL('quinas://recovery');
      appUrl.searchParams.set('token', token);
      openApp.href = appUrl.toString();
      openApp.hidden = false;
      description.textContent = 'O link está pronto. Abre a aplicação Quinas para definir uma nova palavra-passe.';
      status.textContent = 'Por segurança, o token é válido por tempo limitado e só pode ser utilizado uma vez.';
    })();
  </script>
</body>
</html>
